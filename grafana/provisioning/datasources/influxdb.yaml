apiVersion: 1
datasources:
  - name: InfluxDB-Flux
    uid: influxdb-flux
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: false
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET
    secureJsonData:
      token: $INFLUXDB_ADMIN_TOKEN
